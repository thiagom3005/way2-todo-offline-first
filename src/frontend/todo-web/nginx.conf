# Build de produção do PWA com /api na MESMA origem (sem CORS). O Service Worker não tem dataGroups:
# chamadas /api sempre vão à rede; só o shell (HTML/JS/CSS/ícones) fica em cache para abrir offline.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json application/manifest+json;

    # Resolve "api" a cada requisição: o nginx sobe e continua servindo o app mesmo com a API parada
    # (as chamadas recebem 502 e o SyncEngine mostra "offline").
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # Sobrescreve (não acrescenta): um X-Forwarded-For enviado pelo cliente nunca chega à API.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Arquivos que anunciam a versão publicada: sempre revalidados, para o Service Worker ver atualizações.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /safety-worker.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # JS/CSS com hash no nome (outputHashing: all) podem ficar em cache longo.
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Rotas da SPA (/tasks, /login) caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
