# Cabeçalhos de segurança, incluídos em CADA location: um add_header dentro de um location descarta os
# herdados do server. "always" vale também para respostas de erro (404, 502 com a API parada).
#
# CSP: o token de acesso fica no localStorage, então a principal defesa contra XSS é não executar script
# que não venha deste servidor. O build não tem script nem estilo inline (inlineCritical desligado no
# angular.json) e o app não usa estilos de componente, por isso nem 'unsafe-inline' em style-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
