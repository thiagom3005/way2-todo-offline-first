name: way2-todo

# Ambiente local de desenvolvimento/demonstração. Valores padrão são apenas para dev;
# sobrescreva via arquivo .env (veja .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-way2_todo}
      POSTGRES_USER: ${POSTGRES_USER:-way2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-way2_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: src/backend/Way2.Todo.Api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Todo: "Host=db;Port=5432;Database=${POSTGRES_DB:-way2_todo};Username=${POSTGRES_USER:-way2};Password=${POSTGRES_PASSWORD:-way2_dev_only}"
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-do-not-use-in-production-0123456789}
      DemoSeed__Enabled: ${DEMO_SEED_ENABLED:-true}
      DemoSeed__Users__0__Email: demo@way2.local
      DemoSeed__Users__0__Password: ${DEMO_PASSWORD:-Way2Demo!2026}
      DemoSeed__Users__1__Email: demo2@way2.local
      DemoSeed__Users__1__Password: ${DEMO_PASSWORD:-Way2Demo!2026}
    ports:
      - "${API_PORT:-5080}:8080"

  # Build de produção do PWA (Service Worker ativo) com /api encaminhado para a API na mesma origem.
  # Dois "dispositivos" no mesmo navegador: http://localhost:4280 e http://127.0.0.1:4280.
  web:
    build:
      context: src/frontend/todo-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-4280}:80"

volumes:
  pgdata:
